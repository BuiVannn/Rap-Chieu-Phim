<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Kỳ doanh thu chưa chốt</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <span class="brand">🎬 CGV Mini — Quản lý</span>
    <a th:href="@{/quan-ly}">Khu quản lý</a>
    <a th:href="@{/quan-ly/chot-doanh-thu}">Chốt doanh thu</a>
</header>
<main>
    <h1>Danh sách kỳ doanh thu chưa chốt</h1>
    <div class="card">
        <table>
            <thead>
            <tr><th>Kỳ</th><th>Từ ngày</th><th>Đến ngày</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="k : ${danhSachKy}">
                <td th:text="'#' + ${k.id}"></td>
                <td th:text="${k.ngayBatDau}"></td>
                <td th:text="${k.ngayKetThuc}"></td>
                <td><span class="tag" th:text="${k.trangThai}"></span></td>
                <td><a class="btn" th:href="@{'/quan-ly/chot-doanh-thu/' + ${k.id}}">Xem & chốt</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(danhSachKy)}">
                <td colspan="5" class="muted">Không có kỳ nào đang chờ chốt.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
