<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đã hủy vé</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <span class="brand">🎬 CGV Mini</span>
    <a th:href="@{/}">Trang chủ</a>
</header>
<main>
    <h1 class="ok">Đã hủy vé #<span th:text="${veId}"></span></h1>
    <div class="card">
        <p>Số tiền hoàn: <strong th:text="${#numbers.formatInteger(soTienHoan,0,'POINT')} + ' đ'"></strong></p>
        <p class="muted">Thông báo hoàn tiền đã được gửi (mô phỏng). Xem log server để kiểm tra.</p>
        <a class="btn" th:href="@{/}">Về trang chủ</a>
    </div>
</main>
</body>
</html>
