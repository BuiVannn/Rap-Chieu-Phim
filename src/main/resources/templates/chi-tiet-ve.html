<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vé điện tử — CineHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <span class="brand">🎬 Cine<span class="dot">Hub</span></span>
    <a th:href="@{/}">Trang chủ</a>
    <a th:href="@{/phim/tim-kiem}">Phim</a>
    <a th:href="@{/ve-cua-toi}">Vé của tôi</a>
    <span class="spacer"></span>
    <a th:href="@{/dang-xuat}">Đăng xuất</a>
</header>
<main style="max-width:560px">
    <h1>Vé điện tử #<span th:text="${ketQua.ve.id}"></span></h1>
    <p><a class="muted" th:href="@{/ve-cua-toi}">← Quay lại Vé của tôi</a></p>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px">
            <div>
                <h2 style="margin-top:0" th:text="${ketQua.ve.suatChieu.phim.tenPhim}">Tên phim</h2>
                <p class="muted" th:text="${ketQua.ve.suatChieu.phim.theLoai} + ' · ' + ${ketQua.ve.suatChieu.phim.thoiLuong} + ' phút'"></p>
            </div>
            <span class="badge"
                  th:classappend="${ketQua.ve.trangThai == 'Đã bán'} ? 'green' : (${ketQua.ve.trangThai == 'Đã hủy'} ? 'red' : 'amber')"
                  th:text="${ketQua.ve.trangThai}">Đã bán</span>
        </div>

        <div class="stat-row" style="margin-top:8px">
            <div class="stat"><div class="k">Ngày chiếu</div><div class="v" style="font-size:15px" th:text="${ketQua.ve.suatChieu.ngayChieu}"></div></div>
            <div class="stat"><div class="k">Giờ chiếu</div><div class="v" style="font-size:15px" th:text="${ketQua.ve.suatChieu.gioBatDau}"></div></div>
            <div class="stat"><div class="k">Phòng</div><div class="v" style="font-size:15px" th:text="${ketQua.ve.suatChieu.phongChieu.tenPhong}"></div></div>
            <div class="stat"><div class="k">Ghế</div><div class="v" style="font-size:15px" th:text="${ketQua.ve.ghe.soGhe}"></div></div>
        </div>

        <p style="margin-top:14px">Giá vé:
            <strong th:text="${#numbers.formatInteger(ketQua.ve.giaVeApDung,0,'POINT')} + ' đ'"></strong></p>

        <div th:if="${ketQua.ve.maQR != null}" style="margin-top:10px; padding:16px; border:1px dashed var(--border); border-radius:10px; text-align:center">
            <div class="muted" style="font-size:12px; letter-spacing:2px; text-transform:uppercase">Mã QR vào rạp</div>
            <div style="font-size:18px; font-weight:800; letter-spacing:1px; margin-top:6px" th:text="${ketQua.ve.maQR}">QR-XXXX</div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0">Hủy vé</h2>
        <div th:if="${ketQua.duocHuy}">
            <p class="ok" th:text="${ketQua.lyDo}"></p>
            <p>Số tiền hoàn dự kiến:
                <strong th:text="${#numbers.formatInteger(ketQua.soTienHoanDuKien,0,'POINT')} + ' đ'"></strong></p>
            <form method="post" th:action="@{'/ve-cua-toi/' + ${ketQua.ve.id} + '/huy'}"
                  onsubmit="return confirm('Xác nhận hủy vé này?');">
                <button class="btn" type="submit">Xác nhận hủy &amp; hoàn tiền</button>
            </form>
        </div>
        <div th:unless="${ketQua.duocHuy}">
            <p class="muted" th:text="${ketQua.lyDo}"></p>
        </div>
    </div>
</main>
<footer>CineHub · Đặt vé xem phim</footer>
</body>
</html>
