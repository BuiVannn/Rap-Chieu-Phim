# ===== Ket noi CSDL =====
# Uu tien bien moi truong (khi deploy/Docker); mac dinh la MySQL localhost khi chay may.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quan_ly_rap_chieu_phim?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:matkhau_cua_ban}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Hibernate / JPA =====
# update: Hibernate tu tao/cap nhat bang theo dung 15 lop Entity (khop thiet ke 4.2)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Cong chay ung dung =====
# PORT do nen tang cloud (Railway/Render) cap phat; mac dinh 8080 khi chay may.
server.port=${PORT:8080}

# ===== Cau hinh nghiep vu =====
# So gio toi thieu truoc gio chieu de duoc huy ve.
app.huy-ve.gio-toi-thieu=${HUY_VE_GIO_TOI_THIEU:2}
